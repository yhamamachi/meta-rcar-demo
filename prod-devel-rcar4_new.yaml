desc: "Xen-Troops development setup for Renesas RCAR Gen4 hardware"
min_ver: "0.15"

variables:
  YOCTOS_WORK_DIR: "yocto"
  DOM0_BUILD_DIR: "build-dom0"
  DOMD_BUILD_DIR: "build-domd"
  DOMU_BUILD_DIR: "build-domu"
  XT_DOMD_DTB_NAME: "%{SOC_FAMILY}-%{MACHINE}-domd.dtb"
  XT_DOMU_DTB_NAME: "%{SOC_FAMILY}-%{MACHINE}-domu.dtb"
  XT_XEN_DTB_NAME: "%{SOC_FAMILY}-%{MACHINE}-xen.dtb"
  XT_GENERIC_DOMU_TAG: ""
  XT_DOMD_CONFIG_NAME: "domd-%{MACHINE}.cfg"
  XT_DOMU_CONFIG_NAME: "domu-%{MACHINE}.cfg"
  # Android related
  ANDROID_KERNEL_DIR: "android_kernel"
  DOMA_DIR: "android"
  XT_DOMA_TAG: ""
  XT_DOMA_DTB_NAME: ""
  XT_DOMA_KERNEL_EXTRA_MODULES: ""
  XT_DOMA_SOURCE_GROUP: ""
  XT_DOMA_CONFIG_NAME: "doma-virtio.cfg"
  ANDROID_KERNEL_BUILD_CONFIG: "//common-modules/xen-virtual-device:xen_virtual_device_aarch64_dist"
  ANDROID_KERNEL_DEPLOY_DIR: "out/deploy/common-modules/xen-virtual-device/xen_virtual_device_aarch64"
  ANDROID_DEVICE: "xenvm_trout_arm64"
  ANDROID_LUNCH_TARGET: "aosp_xenvm_trout_arm64-trunk_staging-userdebug"

common_data:
  # Sources used by all yocto-based domains
  # poky, meta-openembedded, meta-virtualization uses AGL verified revision.
  # meta-xt-common pins to head of master.
  sources: &COMMON_SOURCES
    - type: git
      url: "https://git.yoctoproject.org/poky"
      rev: "1d54d1c4736a114e1cecbe85a0306e3814d5ce70"
    - type: git
      url: "https://git.openembedded.org/meta-openembedded"
      rev: "ef3df29f2cfca6a9513b51ebcdccf82b6c8a836f"
    - type: git
      url: "https://git.yoctoproject.org/meta-virtualization"
      rev: "f851f730ec415d266bfe0c5941c228a63a896298"
    - type: git
      url: "https://github.com/xen-troops/meta-xt-common.git"
      rev: "1164ec5123bfe687503b79126cbd2d86dfa39eaf"

  # Common configuration options for all yocto-based domains
  conf: &COMMON_CONF
    - [DL_DIR, "${TOPDIR}/../common_data/downloads"]

    # Skip warning about missing "virtualization" distro feature
    - [SKIP_META_VIRT_SANITY_CHECK, "1"]

    # Use hypervisor console on all guests
    - [SERIAL_CONSOLES, "115200;hvc0"]

    # Remove features that we are not using
    - [DISTRO_FEATURES:remove, "x11 gtk gobject-introspection-data wifi nfc
            bluetooth irda zeroconf 3g sysvinit acl alsa argp pcmcia usbgadget
            usbhost  ptest multiarch  vulkan sysvinit pulseaudio"]

    - [PREFERRED_VERSION_xen-tools, "4.19.0+git%"]
    - [PREFERRED_VERSION_xen, "4.19.0+git%"]

    # Specify the linux kernel version
    - [PREFERRED_VERSION_linux-renesas, "6.12%"]
    - [LINUXLIBCVERSION, "6.12%"]

  # Conf options for domain that are built used renesas layer
  domd_domu_conf: &DOMD_DOMU_CONF
    - [MACHINE, "%{MACHINE}"]
    - [SOC_FAMILY, "%{SOC_FAMILY}"]

    # Add systemd configuration
    - [INIT_MANAGER, "systemd"]
    - [DISTRO_FEATURES:append, " usrmerge"]
    - [TRO_FEATURES:remove:xen-tools, "systemd"]
    #- [VIRTUAL-RUNTIME_init_manager, "systemd"]

    # add the static lib to SDK toolchain
    - [SDKIMAGE_FEATURES:append, " staticdev-pkgs"]

    # Add for gstreamer plugins ugly
    - [LICENSE_FLAGS_ACCEPTED, "commercial"]

    # Add Capacity Aware migration Strategy (CAS)
    - [MACHINE_FEATURES:append, " cas"]

    # Remove ptest to reduce the build time
    - [DISTRO_FEATURES:remove, "ptest"]

    # Generate ext4 image files
    - [IMAGE_FSTYPES:append, " ext4"]

    - [PACKAGECONFIG:remove, "perf"]
    - [PACKAGECONFIG:remove, "tools-profile"]
    - [RENESAS_EXTRA_IMAGE_FEATURES:remove, "tools-profile"]
    - [CORE_IMAGE_EXTRA_INSTALL:remove, "perf"]
    #- [MACHINE_FEATURES:append, " gsx"]
    - [IMAGE_INSTALL:append, " socat"]

components:
  dom0:
    build-dir: "%{YOCTOS_WORK_DIR}"
    default: true
    sources:
      - *COMMON_SOURCES
    builder:
      type: yocto
      work_dir: "%{DOM0_BUILD_DIR}"
      conf:
        - *COMMON_CONF
        - [MACHINE, "generic-armv8-xt"]
        - [XT_DOM_NAME, "dom0"]
        - [XT_DOMD_CONFIG_NAME, "%{XT_DOMD_CONFIG_NAME}"]
        - [XT_DOMU_CONFIG_NAME, "%{XT_DOMU_CONFIG_NAME}"]
        - [XT_DOMD_DTB_NAME, "%{XT_DOMD_DTB_NAME}"]
        - [XT_GUEST_INSTALL, "%{XT_GENERIC_DOMU_TAG} %{XT_DOMA_TAG} domd"]

        # Disable HWDB which quite huge (around 15MB) and is not required at all
        - [BAD_RECOMMENDATIONS:append, " udev-hwdb"]

        # Enable systemd on dom0
        - [DISTRO_FEATURES:append, " usrmerge systemd"]
        - [VIRTUAL-RUNTIME_init_manager, "systemd"]

        # Do not install kernel image to rootfs to decrease initrd size
        - ["RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base", ""]


      layers:
        - "../meta-virtualization"
        - "../meta-openembedded/meta-oe"
        - "../meta-openembedded/meta-filesystems"
        - "../meta-openembedded/meta-python"
        - "../meta-openembedded/meta-networking"
        - "../meta-xt-common/meta-xt-control-domain"
        - "../meta-xt-common/meta-xt-dom0"
        - "../meta-xt-common/meta-xt-domx"
      build_target: core-image-thin-initramfs
      external_src:
        domd: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/"
      additional_deps:
        - "%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/Image"
      target_images:
        - "tmp/deploy/images/generic-armv8-xt/Image"
        - "tmp/deploy/images/generic-armv8-xt/uInitramfs"
  domd:
    build-dir: "%{YOCTOS_WORK_DIR}"
    sources:
      - *COMMON_SOURCES
      - type: git
        url: https://git.yoctoproject.org/meta-selinux
        rev: scarthgap
    builder:
      type: yocto
      work_dir: "%{DOMD_BUILD_DIR}"
      conf:
        - *COMMON_CONF
        - *DOMD_DOMU_CONF
        - [XT_DOM_NAME, "domd"]
        - [XT_DEVICE_TREES, "%{XT_DOMD_DTB_NAME} %{XT_XEN_DTB_NAME} %{XT_DOMA_DTB_NAME}"]
        - [XT_GUEST_INSTALL, "%{XT_GENERIC_DOMU_TAG} %{XT_DOMA_TAG}"]
        - [IMAGE_INSTALL:append, " iperf3"]
        - [IMAGE_INSTALL:append, " smcroute"]
        - [IMAGE_INSTALL:append, " snort"]

      build_target: core-image-weston initramfs-image
      layers:
        - "../meta-virtualization"
        - "../meta-selinux"
        - "../meta-openembedded/meta-oe"
        - "../meta-openembedded/meta-networking"
        - "../meta-openembedded/meta-python"
        - "../meta-openembedded/meta-filesystems"
        - "../meta-xt-common/meta-xt-domx"
        - "../meta-xt-common/meta-xt-driver-domain"
        - "../meta-xt-common/meta-xt-security"
      target_images:
        - "tmp/deploy/images/%{MACHINE}/Image"
        - "tmp/deploy/images/%{MACHINE}/core-image-weston-%{MACHINE}.rootfs.ext4"
        - "tmp/deploy/images/%{MACHINE}/bl31-%{MACHINE}.srec"
        - "tmp/deploy/images/%{MACHINE}/u-boot-elf-%{MACHINE}.srec"
        - "tmp/deploy/images/%{MACHINE}/xen-%{MACHINE}"
        - "tmp/deploy/images/%{MACHINE}/xenpolicy-4.19-unstable"
        - "tmp/deploy/images/%{MACHINE}/%{XT_XEN_DTB_NAME}"
  domu:
    build-dir: "%{YOCTOS_WORK_DIR}"
    sources:
      - *COMMON_SOURCES
    builder:
      type: yocto
      work_dir: "%{DOMU_BUILD_DIR}"
      conf:
        - *COMMON_CONF
        - *DOMD_DOMU_CONF
        - [MACHINE, "%{DOMU_MACHINE}"]
        - [XT_DOM_NAME, "domu"]
        - [IMAGE_INSTALL:append, " iperf3 "]
        # and xt-common provides 6.4 already. So we need this bbmask until upgrade to 6.4
        - [BBMASK:append, " meta-xt-common/meta-xt-domu/recipes-kernel/linux-libc-headers/"]
        # we have to use opencv 4.1, but meta-oe provides 4.5.5
        - [BBMASK:append, "  meta-openembedded/meta-oe/recipes-support/opencv"]
        # we have to use tbb 2020.2 instead of 2021.5 for opencv 4.1
        - [BBMASK:append, "  meta-openembedded/meta-oe/recipes-support/tbb"]
        # BSP packages is not needed for DomU
        - [IMAGE_INSTALL:remove, "packagegroup-resesas-bsp"]
        - [IMAGE_INSTALL:remove, "packagegroup-renesas-bsp-tools"]
        - [IMAGE_INSTALL:remove, "packagegroup-renesas-bsp-demo"]

      layers:
        - "../meta-openembedded/meta-oe"
        - "../meta-openembedded/meta-filesystems"
        - "../meta-openembedded/meta-python"
        - "../meta-xt-common/meta-xt-domu"
        - "../meta-xt-common/meta-xt-security"
      build_target: core-image-weston
      target_images:
        - "tmp/deploy/images/%{DOMU_MACHINE}/Image"
        - "tmp/deploy/images/%{DOMU_MACHINE}/core-image-weston-%{DOMU_MACHINE}.rootfs.ext4"

  doma_kernel:
    build-dir: "%{ANDROID_KERNEL_DIR}"
    sources:
      - type: repo
        url: https://github.com/xen-troops/android_kernel_manifest.git
        rev: 23e08b76317bfb41d4ec4f68a891fb00bf591b0b
        manifest: default.xml
        depth: 1
        groups: "%{XT_DOMA_SOURCE_GROUP}"
        dir: "."
    builder:
      type: bazel
      tool: "tools/bazel"
      command: run
      args:
        - "--verbose_failures"
        - "--sandbox_debug"
      target: "%{ANDROID_KERNEL_BUILD_CONFIG}"
      target-patterns:
        - "--dist_dir=%{ANDROID_KERNEL_DEPLOY_DIR}"
      target_images:
        - "%{ANDROID_KERNEL_DEPLOY_DIR}/Image"

  doma:
    build-dir: "%{DOMA_DIR}"
    sources:
      - type: repo
        url: https://github.com/yhamamachi/android_manifest.git
        rev: 66e0959d32f2c3c146153b703ba57b900a1ef325
        manifest: default.xml
        depth: 1
        groups: "%{XT_DOMA_SOURCE_GROUP}"
        dir: "."
    builder:
      type: android
      env:
        - "TARGET_BOARD_PLATFORM=%{SOC_FAMILY}"
        - "TARGET_PREBUILT_KERNEL=../%{ANDROID_KERNEL_DIR}/%{ANDROID_KERNEL_DEPLOY_DIR}/Image"
        - "TARGET_PREBUILT_MODULES_DIR=../%{ANDROID_KERNEL_DIR}/%{ANDROID_KERNEL_DEPLOY_DIR}/"
      lunch_target: "%{ANDROID_LUNCH_TARGET}"
      target_images:
        - "out/target/product/%{ANDROID_DEVICE}/boot.img"
        - "out/target/product/%{ANDROID_DEVICE}/init_boot.img"
        - "out/target/product/%{ANDROID_DEVICE}/vendor_boot.img"
        - "out/target/product/%{ANDROID_DEVICE}/vendor_dlkm.img"
        - "out/target/product/%{ANDROID_DEVICE}/vbmeta.img"
        - "out/target/product/%{ANDROID_DEVICE}/vbmeta_system.img"
        - "out/target/product/%{ANDROID_DEVICE}/vbmeta_system_dlkm.img"
        - "out/target/product/%{ANDROID_DEVICE}/vbmeta_vendor_dlkm.img"
        - "out/target/product/%{ANDROID_DEVICE}/userdata.img"
        - "out/target/product/%{ANDROID_DEVICE}/super.img"
      additional_deps:
        - "../%{ANDROID_KERNEL_DIR}/%{ANDROID_KERNEL_DEPLOY_DIR}/Image"

  boot_artifacts:
    build-dir: "artifacts"
    builder:
      type: archive
      name: "%{MACHINE}-boot-artifacts.tar.bz"
      items:
        - "%{YOCTOS_WORK_DIR}/%{DOM0_BUILD_DIR}/tmp/deploy/images/generic-armv8-xt/Image"
        - "%{YOCTOS_WORK_DIR}/%{DOM0_BUILD_DIR}/tmp/deploy/images/generic-armv8-xt/uInitramfs"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bl31-%{MACHINE}.srec"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/u-boot-elf-%{MACHINE}.srec"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/xen-%{MACHINE}"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/xenpolicy-4.19-unstable"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/%{XT_XEN_DTB_NAME}"

images:
  full:
    type: gpt
    desc: "Full SD-card/eMMC image"
    partitions:
      boot:
        gpt_type: 21686148-6449-6E6F-744E-656564454649 # BIOS boot partition (kinda...)
        type: ext4
        size: 256 MiB
      domd_rootfs:
        gpt_type: B921B045-1DF0-41C3-AF44-4C6F280D3FAE # Linux aarch64 root
        type: raw_image
        image_path: "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/core-image-weston-%{MACHINE}.rootfs.ext4"

parameters:
  ENABLE_DOMU:
    desc: "Build generic Yocto-based DomU"
    "no":
      default: true
    "yes":
      overrides:
        variables:
          XT_GENERIC_DOMU_TAG: "domu"
        components:
          dom0:
            builder:
              additional_deps:
                - "%{DOMU_BUILD_DIR}/tmp/deploy/images/%{DOMU_MACHINE}/Image"
              external_src:
                domu: "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/%{DOMU_MACHINE}/"
        images:
          full:
            partitions:
              domu-rootfs:
                type: raw_image
                gpt_type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4 # Linux filesystem data
                #image_path: "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/core-image-weston-%{MACHINE}.rootfs.ext4"
                image_path: "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/core-image-minimal-%{MACHINE}.rootfs.ext4"
# parameters:
  MACHINE:
    desc: "RCAR Gen4-based device"
    "sparrow-hawk":
      default: true
      overrides:
        variables:
          MACHINE: "sparrow-hawk"
          SOC_FAMILY: "r8a779g3"
        components:
          dom0:
            builder:
              conf:
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-multimedia/opencv/"]
              layers:
                - "../meta-sparrow-hawk"
          domd:
            sources:
              - type: git
                url: https://github.com/rcar-community/meta-sparrow-hawk
                rev: e05b3389006f0052349746918c587534a11a805b
            builder:
              layers:
                - "../meta-sparrow-hawk"
          domu:
            builder:
              conf:
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-multimedia/opencv/"]
              layers:
                - "../meta-sparrow-hawk"
  ADD_META_TEST:
    desc: "Add meta-test layer and some configs"
    "no":
      desc: "Nothing to do"
      default: true
    "yes":
      overrides:
        components:
          dom0:
            builder:
              layers:
                - "../../../meta-xen-dom0"
                - "../../../meta-xen-domx"
                - "../meta-openembedded/meta-multimedia"
              external_src:
                core-image-thin-initramfs: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/"
              conf:
                - [XT_XEN_DTB_NAME, "%{XT_XEN_DTB_NAME}"]
              target_images:
                - "tmp/deploy/images/generic-armv8-xt/fitImage"
          domd:
            builder:
              layers:
                - "../../../meta-xen-domd"
                - "../../../meta-xen-domx"
                - "../meta-openembedded/meta-multimedia"
              conf:
                - [IMAGE_INSTALL:append, " iperf3 htop tcpdump coreutils ethtool"]
                - [IMAGE_INSTALL:append, " udev-rules"]
                - [MACHINE_EXTRA_RRECOMMENDS:remove, "linux-fitimage"]
              target_images:
                - "tmp/deploy/images/%{MACHINE}/flash.bin"
          domu:
            builder:
              layers:
                - "../meta-openembedded/meta-networking"
                - "../meta-openembedded/meta-multimedia"
                - "../../../meta-xen-domu"
              conf:
                - [IMAGE_INSTALL:append, " iperf3 htop tcpdump libaio coreutils rt-tests ethtool fio"]
                - [IMAGE_INSTALL:append, " udev-rules"]
                - [EXTRA_IMAGE_FEATURES:append, " ssh-server-openssh"]

                # Remove unneeded pakcages for DomU
                - [EXTRA_IMAGEDEPENDS:remove, " arm-trusted-firmware"]
                - [IMAGE_INSTALL:remove, "libcamera libcamera-pycamera"]
                - [MACHINE_EXTRA_RRECOMMENDS:remove, "linux-fitimage"]
                # Mask graphic Pkgs
                - [BBMASK, "kernel-module-gles|user-module-gles"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/wayland-wsegl"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/wayland-kms"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/libgbm"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/weston_%.bbappend"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/packagegroups/packagegroup-renesas-graphics.bb"]
                # CPU rendering for core-image-weston
                # - [IMAGE_INSTALL:append, " mesa glmark2"]
                # - [DISTRO_FEATURES_NATIVESDK:append, "wayland x11"]
                # - [DISTRO_FEATURES:append, " pam wayland"]
                # - [DISTRO_FEATURES:remove, " ptest x11 vulkan"]
        images:
          full:
            partitions:
              boot:
                items:
                  "flash.bin": "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/flash.bin"
                  "fitImage": "%{YOCTOS_WORK_DIR}/build-dom0/tmp/deploy/images/generic-armv8-xt/fitImage"
                  "/boot/fitImage": "%{YOCTOS_WORK_DIR}/build-dom0/tmp/deploy/images/generic-armv8-xt/fitImage"

  USE_GRAPHICS_PACKAGE:
    desc: "Enable GPU on DomD"
    "no":
      desc: "Nothing to do"
      overrides:
        components:
          domd:
            builder:
              conf:
                # Use CPU rendering
                - [IMAGE_INSTALL:append, " mesa"]
                - [DISTRO_FEATURES_NATIVESDK:append, " wayland x11"]
                - [DISTRO_FEATURES:append, " pam wayland"]
                - [DISTRO_FEATURES:remove, " ptest x11 vulkan"]
                # Mask graphic Pkgs
                - [BBMASK, "kernel-module-gles|user-module-gles"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/wayland-wsegl"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/wayland-kms"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/libgbm"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/wayland/weston_%.bbappend"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-graphics/packagegroups/packagegroup-renesas-graphics.bb"]
    "yes":
      default: true
      overrides:
        components:
          dom0:
            builder:
              conf:
                # Enable Gfx Pkgs
                - [MACHINE_FEATURES:append, " gsx"]
          domd:
            builder:
              layers:
                - "../../../meta-xen-domd-gfx"
              conf:
                # Enable Gfx Pkgs
                - [MACHINE_FEATURES:append, " gsx"]
                # Enable Wayland/Weston
                - [DISTRO_FEATURES_NATIVESDK:append, " wayland"]
                - [DISTRO_FEATURES:append, " pam wayland"]
                - [BB_MULTI_PROVIDER_ALLOWED:append, "virtual/libgl virtual/egl virtual/libgles1 virtual/libgles2"]
                - [PREFERRED_PROVIDER_virtual/libgles1, ""]
                - [PREFERRED_PROVIDER_virtual/libgles2, "user-module-gles"]
                - [PREFERRED_PROVIDER_virtual/egl, "libegl"]
                - [PREFERRED_PROVIDER_virtual/libgl, ""]
                - [PREFERRED_PROVIDER_virtual/mesa, ""]
                - [PREFERRED_PROVIDER_virtual/libgbm, "libgbm"]
                - [PREFERRED_PROVIDER_libgbm-dev, "libgbm"]

  ENABLE_VIRTIO:
    desc: "Add meta-test layer and some configs"
    "no":
      desc: "Nothing to do"
      default: true
      overrides:
        variables:
          DOMU_MACHINE: "sparrow-hawk"
        components:
          dom0:
            builder:
              conf:
                - [XT_DOMU_DTB_NAME, "%{XT_DOMU_DTB_NAME}"]
          domu:
            builder:
              build_target: core-image-minimal
    "yes":
      overrides:
        variables:
          DOMU_MACHINE: "virtio-armv8-xt"
        components:
          dom0:
            builder:
              layers:
                - "../meta-xt-common/meta-xt-control-domain-virtio"
                - "../meta-xt-common/meta-xt-qemu"
              conf:
                - [OVERRIDES:append, ":enable_virtio"]
                - [DISTRO_FEATURES:append, " enable_virtio"]
                - [DISTRO_FEATURES:append, " xen vmsep"]
                - [IMAGE_INSTALL:remove, "qemu-system-aarch64"]
                - [XT_DOMU_CONFIG_NAME, "domu-virtio.cfg"]
                - [QEMUVERSION, "7.0%"]
          domd:
            builder:
              layers:
                - "../meta-xt-common/meta-xt-driver-domain-virtio"
                - "../meta-xt-common/meta-xt-qemu"
                - "../../../meta-xen-domd-virtio"
              conf:
                - [DISTRO_FEATURES:append, " enable_virtio"]
                - [DISTRO_FEATURES:append, " xen vmsep"]
                - [QEMUVERSION, "7.0%"]
                - [BBMASK:append, " meta-xt-common/meta-xt-driver-domain-virtio/recipes-extended/xen/"]

  ENABLE_DOMU_VIRTIO:
    desc: "Build Linux as a guest VM using Virtio backend"
    "no":
      desc: "Nothing to do"
      default: true
      overrides:
        variables:
          DOMU_MACHINE: "sparrow-hawk"
        components:
          dom0:
            builder:
              conf:
                - [XT_DOMU_DTB_NAME, "%{XT_DOMU_DTB_NAME}"]
          domu:
            builder:
              build_target: core-image-minimal
    "yes":
      overrides:
        variables:
          DOMU_MACHINE: "virtio-armv8-xt"
        components:
          domu:
            builder:
              layers:
                - "../meta-xt-common/meta-xt-domu-virtio"
              conf:
                - [EXTRA_IMAGEDEPENDS:remove, "u-boot"]
                - [IMAGE_INSTALL:remove, "u-boot"]
                - [IMAGE_INSTALL:remove, "kernel-devicetree"]
                - [IMAGE_INSTALL:remove, "kernel-module-qos"]
                - [IMAGE_INSTALL:remove, "qosif-user-module"]
                - [IMAGE_INSTALL:remove, "qosif-tp-user-module"]
                # Use CPU rendering
                - [IMAGE_INSTALL:append, " mesa"]
                - [DISTRO_FEATURES_NATIVESDK:append, " wayland x11"]
                - [DISTRO_FEATURES:append, " pam wayland"]
                - [DISTRO_FEATURES:remove, " ptest x11 vulkan"]
                - [IMAGE_INSTALL:remove, " kernel-devicetree"]
            builder:
              build_target: core-image-weston
        images:
          full:
            partitions:
              domu-rootfs:
                type: raw_image
                gpt_type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4 # Linux filesystem data
                image_path: "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/virtio-armv8-xt/core-image-weston-virtio-armv8-xt.rootfs.ext4"

  ENABLE_DOMU_AGL_CLUSTER:
    desc: "Install AGL Cluster reference applicatin to DomU"
    "no":
      desc: "Nothing to do"
      default: true
      overrides:
        components:
          domu:
            builder:
              conf:
                - [BBMASK:append, "|meta-xen-domu/recipes-agl/"]
    "yes":
      overrides:
        components:
          domu:
            sources:
              - type: git
                url: https://code.qt.io/yocto/meta-qt6.git
                rev: 9bd2c2ae4b4fb536975904fe494813408a2282a3
                # dev branch
            builder:
              layers:
                - "../meta-qt6"
              conf:
                - [IMAGE_INSTALL:append, " cluster-refgui"]

  ENABLE_ANDROID:
    desc: "Build Android as a guest VM"
    "no":
      overrides:
        variables:
          XT_DOMA_TAG: ""
        components:
          dom0:
            builder:
              conf:
                - [BBMASK:append, " doma.bb*"]
    "yes":
      default: true
      overrides:
        variables:
          XT_DOMA_TAG: "doma"
          XT_DOMA_DTB_NAME: "doma-virtio.dtb"
        components:
          dom0:
            builder:
              conf:
                - [XT_DOMA_DTB_NAME, "%{XT_DOMA_DTB_NAME}"]
                - [XT_DOMA_CONFIG_NAME, "%{XT_DOMA_CONFIG_NAME}"]
                # Flag, which allows to override parameters on the Yocto level.
                # E.g. amount of used RAM for driver domain.
                - [OVERRIDES:append, ":enable_android"]
              additional_deps:
                # This is not actually a hard dep. We just want to force Android build
                - "../%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/boot.img"
              external_src:
                # Android uses DTB generated by DomD
                doma: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/"
          domd:
            sources:
              - type: git
                url: https://github.com/kraj/meta-clang.git
                rev: 9fbfa9db33131abdf3870a94f00199eb53e276e5 # scarthgap
            builder:
              layers:
                - "../meta-clang"
                - "../../%{DOMA_DIR}/device/epam/aosp-xenvm-trout/agl_services_build/yocto-layer/meta-google"
              conf:
                - [BBMASK:append, "|meta-google/recipes-trout/images/rcar-image-adas.bbappend"]
              additional_deps:
                # We need some dependency to AOSP artifacts as we are using the "meta-google"
                # layer directly from its source code. Thus DomA should be built before DomD.
                - "../%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/boot.img"
        images:
          android_only: &ANDROID_IMAGE
            desc: "Android sub-image (this image is passed to Android VM as a separate block device)"
            gpt_type:  A326898F-C893-4A64-9990-6F6B7BFDEF18 # GPT type for the upper GPT
            type: gpt
            partitions:
              boot_a:
                gpt_type: 49A4D17F-93A3-45C1-A0DE-F50B2EBE2599 # Android boot 1
                type: raw_image
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/boot.img"
              boot_b:
                gpt_type: 20117F86-E985-4357-B9EE-374BC1D8487D # Android boot 2
                type: empty
                size: 70 MiB
              init_boot_a:
                gpt_type: 49A4D17F-93A3-45C1-A0DE-F50B2EBE2599 # Android boot 1
                type: raw_image
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/init_boot.img"
              init_boot_b:
                gpt_type: 20117F86-E985-4357-B9EE-374BC1D8487D # Android boot 2
                type: empty
                size: 10 MiB
              vendor_boot_a:
                gpt_type: DF24E5ED-8C96-4B86-B00B-79667DC6DE11 # Android sparse 1
                type: raw_image
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/vendor_boot.img"
              vendor_boot_b:
                gpt_type: 7C29D3AD-78B9-452E-9DEB-D098D542F092 # Android sparse 2
                type: empty
                size: 70 MiB
              vbmeta_a:
                gpt_type: 19A710A2-B3CA-11E4-B026-10604B889DCF # Android meta
                type: raw_image
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/vbmeta.img"
              vbmeta_b:
                gpt_type: 19A710A2-B3CA-11E4-B026-10604B889DCF # Android meta
                type: empty
                size: 1 MiB
              vbmeta_system_a:
                gpt_type: E7C06570-9FDC-11E8-8C15-0A580A200C13 # Android meta
                type: raw_image
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/vbmeta_system.img"
              vbmeta_system_b:
                gpt_type: E7C06570-9FDC-11E8-8C15-0A580A200C13 # Android meta
                type: empty
                size: 1 MiB
              vbmeta_system_dlkm_a:
                gpt_type: E7C06570-9FDC-11E8-8C15-0A580A200C13 # Android meta
                type: raw_image
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/vbmeta_system_dlkm.img"
              vbmeta_system_dlkm_b:
                gpt_type: E7C06570-9FDC-11E8-8C15-0A580A200C13 # Android meta
                type: empty
                size: 1 MiB
              vbmeta_vendor_dlkm_a:
                gpt_type: E7C06570-9FDC-11E8-8C15-0A580A200C13 # Android meta
                type: raw_image
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/vbmeta_vendor_dlkm.img"
              vbmeta_vendor_dlkm_b:
                gpt_type: E7C06570-9FDC-11E8-8C15-0A580A200C13 # Android meta
                type: empty
                size: 1 MiB
              misc:
                gpt_type: EF32A33B-A409-486C-9141-9FFB711F6266 # Android misc
                type: empty
                filled: zeroes
                size: 1 MiB
              metadata:
                gpt_type: 20AC26BE-20B7-11E3-84C5-6CFDB94711E9 # Android metadata
                type: ext4
                size: 20 MiB
              rpmbemul:
                gpt_type: DC76DDA9-5AC1-491C-AF42-A82591580C0D # Android data
                type: empty
                filled: zeroes
                size: 1 MiB
              super:
                gpt_type: 4627AE27-CFEF-48A1-88FE-99C3509ADE26 # Android raw resources
                type: android_sparse
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/super.img"
              userdata:
                gpt_type: 1B81E7E6-F50D-419B-A739-2AEEF8DA3335 # Android userdata
                type: android_sparse
                image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/userdata.img"
          full:
            partitions:
              android:
                *ANDROID_IMAGE

