# =====================================================================
# DomU guest configuration
# =====================================================================
seclabel='system_u:system_r:domU_t'
# Guest name
name = "DomU"
# Kernel image to boot
kernel = "/usr/lib/xen/boot/linux-domu"
# Initial memory allocation (MB)
memory = 1024
# Number of VCPUS
vcpus = 4
on_crash = 'preserve'
#tee='optee'

extra = "root=/dev/vda rw rootwait console=hvc0 cma=256M"

# disk, vgsx, vif, vdispl, vkb, vsnd
# are provided in separate file domu-vdevices.cfg
#
#
# =====================================================================
# DomU virtio virtual devices
# =====================================================================

virtio=[
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:01.0, grant_usage=1, backend_type=qemu',
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:02.0, grant_usage=1, backend_type=qemu',
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:03.0, grant_usage=1, backend_type=qemu',
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:04.0, grant_usage=1, backend_type=qemu',
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:06.0, grant_usage=1, backend_type=qemu',
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:05.0, grant_usage=1, backend_type=qemu',
'backend=DomD, type=virtio,device, transport=pci, bdf=0000:00:07.0, grant_usage=1, backend_type=qemu',
]

device_model_args=[
'-device', 'virtio-net-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=1,romfile=,id=nic0,netdev=net0,mac=08:00:27:ff:cb:cf',
'-netdev', 'type=tap,id=net0,ifname=vif-emu2,br=xenbr0,script=no,downscript=no,vhost=off',
'-device', 'virtio-keyboard-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=2',
'-audiodev', 'alsa,id=snd0,out.dev=default',
'-device', 'virtio-snd-pci,audiodev=snd0,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=3',
'-device', 'virtio-gpu-gl-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=4',
'-display', 'sdl,gl=on,show-cursor=on',
'-vga', 'std',
'-device', 'vhost-vsock-pci,guest-cid=4,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=6',
'-device', 'virtio-tablet-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=7',
'-d', 'guest_errors',
'-monitor', 'telnet:127.0.0.1:1235,server,nowait',
'-global', 'virtio-mmio.force-legacy=false',
#'-full-screen',
'-device', 'virtio-blk-pci,scsi=off,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=5,drive=image',
'-drive', 'if=none,id=image,format=raw,file=/dev/STORAGE_PART3',
'-name', 'DomU'
]
