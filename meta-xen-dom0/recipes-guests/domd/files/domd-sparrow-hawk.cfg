# =====================================================================
# DomD guest configuration
# =====================================================================

seclabel='system_u:system_r:domD_t'

# Guest name
name = "DomD"

# Kernel image to boot
kernel = "/usr/lib/xen/boot/linux-domd"

device_tree = "/usr/lib/xen/boot/domd.dtb"

ramdisk = "/usr/lib/xen/boot/initramfs-domd.cpio.gz"

extra = "root=/dev/STORAGE_PART2 rw rootwait console=hvc0 clk_ignore_unused pci=pcie_bus_perf [VIRTIO_EXTRA_PARAMETERS]"

# Initial memory allocation (MB)
#memory = 6144 # For 16GB model
memory = 2048

# Number of VCPUS
vcpus = 4

# Uncomment this lines and add "/pmu_a76" node to
# dt_passthrough_nodes to enable PMU feature. 
# NOTE: this feature is not security supported:
# see https://xenbits.xen.org/xsa/advisory-163.html.
# It's not recommended to use it for production builds
# but it may be used for development or debugging.
# cpus = ["0", "1", "2", "3"]
# vpmu = 1

on_crash = 'preserve'

#Optee is disabled for now
#tee = "optee"

# This is autogenerated config part

dt_compatible = [ "retronix,sparrow-hawk", "renesas,r8a779g3", "renesas,r8a779g0" ]

# Clocks and regulators are needed and are in the device tree root,
# but we do not want to copy all root nodes: handle these one by one
dt_passthrough_nodes = [
    "/extal",
    "/extalr",
    "/scif",
    "/soc",
    "/refclk",
    "/regulator-1p8v",
    "/regulator-3p3v",
    "/pcie_bus",
    "/reserved-memory",
    "/thermal-zones",
    "/mini-dp-con",
    "/extal_clk",
    "/extalr_clk",
    "/clk-x8",
    "/clk-x9",
    "/regulator-1p2v",
    "/sound",
    "/regulator-vcc-sdhi",
    "/audio_clkin",
    "/can",
    "/pcie0-clkref",
    "/pcie1-clkref",
    # CSI Camera
    "/clk-cam-j1",
    "/reg-cam-j1",
    "/clk-cam-j2",
    "/reg-cam-j2",
    # DSI display
    "/backlight",
    "/regulator-display",
    "/regulator-dsi-touch",
]

